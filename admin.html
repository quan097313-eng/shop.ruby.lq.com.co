<div id="adminPanel">

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  updateDoc,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyD28nAKhfVQHF_I134R0YyaWQuGw2FMliY",

  authDomain:
    "admin-shopcuaquan.firebaseapp.com",

  projectId:
    "admin-shopcuaquan",

  storageBucket:
    "admin-shopcuaquan.firebasestorage.app",

  messagingSenderId:
    "608228191463",

  appId:
    "1:608228191463:web:52298a53e0f0a829874642"

};


/* =========================
   INIT
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================
   DATA
========================= */

let currentOrders = [];


/* =========================
   ELEMENTS
========================= */

const loginContainer =
  document.getElementById("loginContainer");

const adminPanel =
  document.getElementById("adminPanel");

const loginError =
  document.getElementById("loginError");

const connectionStatus =
  document.getElementById("connectionStatus");

const ordersTable =
  document.getElementById("ordersTable");


/* =========================
   LOGIN
========================= */

document
  .getElementById("loginBtn")
  .addEventListener("click", login);


async function login(){

  const email =
    document
      .getElementById("adminEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("adminPassword")
      .value;


  loginError.style.display = "none";


  if(!email || !password){

    loginError.textContent =
      "Vui lòng nhập email và mật khẩu.";

    loginError.style.display =
      "block";

    return;
  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    console.error(error);

    loginError.textContent =
      "Email hoặc mật khẩu không đúng.";

    loginError.style.display =
      "block";

  }

}


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async(user)=>{

    if(user){

      loginContainer.style.display =
        "none";

      adminPanel.style.display =
        "block";

      await loadOrders();

    }else{

      loginContainer.style.display =
        "flex";

      adminPanel.style.display =
        "none";

    }

  }
);


/* =========================
   LOGOUT
========================= */

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async()=>{

      await signOut(auth);

    }
  );


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

  ordersTable.innerHTML = `
    <tr>
      <td colspan="9" class="loading">
        Đang tải lịch sử...
      </td>
    </tr>
  `;


  connectionStatus.textContent =
    "🟡 Đang tải dữ liệu Firebase...";


  try{

    const snap =
      await getDocs(
        collection(
          db,
          "exchangeRequests"
        )
      );


    currentOrders = [];


    snap.forEach((item)=>{

      currentOrders.push({

        id:item.id,

        ...item.data()

      });

    });


    currentOrders.sort(
      (a,b)=>{

        const am =
          Number(
            a.createdAtMs || 0
          );

        const bm =
          Number(
            b.createdAtMs || 0
          );


        if(am || bm){

          return bm - am;

        }


        const at =
          a.createdAt?.seconds || 0;

        const bt =
          b.createdAt?.seconds || 0;


        return bt - at;

      }
    );


    renderOrders(
      currentOrders
    );


    connectionStatus.textContent =
      "🟢 Đã kết nối Firebase - Lịch sử đã tải";


  }catch(error){

    console.error(error);

    connectionStatus.textContent =
      "🔴 Không thể tải dữ liệu Firebase";


    ordersTable.innerHTML = `

      <tr>

        <td
          colspan="9"
          class="empty"
        >

          Không thể tải lịch sử đơn hàng.

          <br><br>

          Kiểm tra Firestore Rules và quyền tài khoản Admin.

        </td>

      </tr>

    `;

  }

}


/* =========================
   RENDER
========================= */

function renderOrders(orders){

  let pending = 0;

  let approved = 0;

  let rejected = 0;


  orders.forEach((o)=>{

    if(o.status === "pending")
      pending++;

    if(o.status === "approved")
      approved++;

    if(o.status === "rejected")
      rejected++;

  });


  document.getElementById(
    "totalOrders"
  ).textContent =
    orders.length;


  document.getElementById(
    "pendingOrders"
  ).textContent =
    pending;


  document.getElementById(
    "approvedOrders"
  ).textContent =
    approved;


  document.getElementById(
    "rejectedOrders"
  ).textContent =
    rejected;


  if(!orders.length){

    ordersTable.innerHTML = `

      <tr>

        <td
          colspan="9"
          class="empty"
        >
          Chưa có đơn hàng nào.
        </td>

      </tr>

    `;

    return;

  }


  ordersTable.innerHTML =
    orders.map(
      (item,index)=>{

        const status =
          item.status || "pending";


        let statusText =
          "Đang chờ";

        let statusClass =
          "status-pending";


        if(status === "approved"){

          statusText =
            "Đã duyệt";

          statusClass =
            "status-approved";

        }


        if(status === "rejected"){

          statusText =
            "Từ chối";

          statusClass =
            "status-rejected";

        }


        const orderCode =
          item.orderCode ||
          item.id;


        const price =
          Number(
            item.price || 0
          ).toLocaleString("vi-VN");


        return `

          <tr>

            <td>
              ${index + 1}
            </td>


            <td>
              <span class="order-code">
                ${escapeHTML(orderCode)}
              </span>
            </td>


            <td>
              ${escapeHTML(
                item.name || ""
              )}
            </td>


            <td>
              ${escapeHTML(
                item.reward || ""
              )}
            </td>


            <td>
              ${price}
            </td>


            <td>
              ${escapeHTML(
                item.currency || ""
              )}
            </td>


            <td>
              ${escapeHTML(
                item.time || ""
              )}
            </td>


            <td>

              <span
                class="status ${statusClass}"
              >
                ${statusText}
              </span>

            </td>


            <td>

              <div class="actions">

                ${
                  status !== "approved"

                  ?

                  `<button
                    class="approve"
                    onclick="changeStatus('${item.id}','approved')"
                  >
                    ✓ Duyệt
                  </button>`

                  :

                  ""
                }


                ${
                  status !== "rejected"

                  ?

                  `<button
                    class="reject"
                    onclick="changeStatus('${item.id}','rejected')"
                  >
                    ✕ Từ chối
                  </button>`

                  :

                  ""
                }


                <button
                  class="delete"
                  onclick="removeOrder('${item.id}')"
                >
                  🗑 Xóa
                </button>

              </div>

            </td>

          </tr>

        `;

      }
    ).join("");

}


/* =========================
   CHANGE STATUS
========================= */

window.changeStatus =
  async function(id,status){

    try{

      await updateDoc(

        doc(
          db,
          "exchangeRequests",
          id
        ),

        {
          status:status
        }

      );


      await loadOrders();


    }catch(error){

      console.error(error);

      alert(
        "Không thể cập nhật trạng thái."
      );

    }

  };


/* =========================
   DELETE
========================= */

window.removeOrder =
  async function(id){

    if(
      !confirm(
        "Bạn có chắc muốn xóa đơn này?"
      )
    ){

      return;

    }


    try{

      await deleteDoc(

        doc(
          db,
          "exchangeRequests",
          id
        )

      );


      await loadOrders();


    }catch(error){

      console.error(error);

      alert(
        "Không thể xóa đơn."
      );

    }

  };


/* =========================
   EXPORT CSV
========================= */

document
  .getElementById("exportBtn")
  .addEventListener(
    "click",
    exportCSV
  );


function exportCSV(){

  if(!currentOrders.length){

    alert(
      "Chưa có lịch sử để tải."
    );

    return;

  }


  const rows = [

    [
      "STT",
      "Mã đơn",
      "Tên tài khoản",
      "Phần thưởng",
      "Giá",
      "Loại tiền",
      "Thời gian",
      "Trạng thái"
    ],

    ...currentOrders.map(
      (o,i)=>[

        i + 1,

        o.orderCode ||
        o.id,

        o.name || "",

        o.reward || "",

        o.price || 0,

        o.currency || "",

        o.time || "",

        o.status === "approved"

          ? "Đã duyệt"

          : o.status === "rejected"

          ? "Từ chối"

          : "Đang chờ"

      ]
    )

  ];


  const csv =
    "\uFEFF" +

    rows.map(
      row =>

        row.map(
          value => {

            const s =
              String(value)
                .replace(/"/g,'""');

            return `"${s}"`;

          }
        ).join(",")

    ).join("\r\n");


  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;

  a.download =
    "lich-su-don-hang.csv";


  document.body.appendChild(a);

  a.click();

  a.remove();


  URL.revokeObjectURL(url);

}


/* =========================
   REFRESH
========================= */

document
  .getElementById("refreshBtn")
  .addEventListener(
    "click",
    loadOrders
  );


/* =========================
   ENTER LOGIN
========================= */

document
  .getElementById("adminPassword")
  .addEventListener(
    "keydown",
    (e)=>{

      if(e.key === "Enter"){

        login();

      }

    }
  );


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
```
