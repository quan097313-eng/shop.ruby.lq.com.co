<!DOCTYPE html>
<html lang="vi">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>ADMIN - SHOP NHẬN QUÀ</title>

  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #080d18;
      color: white;
    }

    header {
      background:
        linear-gradient(
          135deg,
          #111827,
          #172554
        );

      padding: 25px;

      border-bottom:
        1px solid #334155;
    }

    header h1 {
      margin: 0;
      color: #facc15;
    }

    .container {
      max-width: 1450px;
      margin: auto;
      padding: 25px 15px 50px;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(4, 1fr);

      gap: 15px;

      margin-bottom: 25px;
    }

    .stat {
      background: #111827;
      border: 1px solid #263449;
      border-radius: 12px;
      padding: 18px;
    }

    .stat-title {
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .stat-number {
      color: #facc15;
      font-size: 28px;
      font-weight: bold;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    input,
    select {
      background: #111827;
      color: white;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      outline: none;
    }

    input {
      flex: 1;
      min-width: 230px;
    }

    select {
      min-width: 170px;
    }

    .table-box {
      overflow-x: auto;
      background: #111827;
      border: 1px solid #263449;
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1100px;
    }

    th,
    td {
      padding: 14px;
      border-bottom: 1px solid #263449;
      text-align: left;
    }

    th {
      background: #0f172a;
      color: #facc15;
    }

    td {
      color: #cbd5e1;
    }

    .order-code {
      color: #facc15;
      font-weight: bold;
    }

    .badge {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 13px;
    }

    .pending {
      background: #713f12;
      color: #fde68a;
    }

    .completed {
      background: #14532d;
      color: #bbf7d0;
    }

    .cancelled {
      background: #7f1d1d;
      color: #fecaca;
    }

    .actions {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .done {
      background: #22c55e;
      color: white;
    }

    .cancel {
      background: #ef4444;
      color: white;
    }

    .delete {
      background: #475569;
      color: white;
    }

    button:hover {
      opacity: .85;
    }

    #message {
      color: #94a3b8;
      margin-bottom: 15px;
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: #64748b;
    }

    @media (max-width: 800px) {

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

    @media (max-width: 450px) {

      .stats {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>

<body>

<header>

  <h1>
    ADMIN - SHOP NHẬN QUÀ LIÊN QUÂN
  </h1>

</header>


<div class="container">


  <!-- THỐNG KÊ -->

  <div class="stats">

    <div class="stat">

      <div class="stat-title">
        Tổng đơn
      </div>

      <div
        class="stat-number"
        id="totalOrders">
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        Đang chờ
      </div>

      <div
        class="stat-number"
        id="pendingOrders">
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        Hoàn thành
      </div>

      <div
        class="stat-number"
        id="completedOrders">
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        Đã hủy
      </div>

      <div
        class="stat-number"
        id="cancelledOrders">
        0
      </div>

    </div>

  </div>


  <!-- TÌM KIẾM -->

  <div class="toolbar">

    <input
      id="search"
      type="text"
      placeholder="Tìm theo mã đơn hoặc tên...">

    <select id="statusFilter">

      <option value="all">
        Tất cả trạng thái
      </option>

      <option value="pending">
        Đang chờ
      </option>

      <option value="completed">
        Hoàn thành
      </option>

      <option value="cancelled">
        Đã hủy
      </option>

    </select>

  </div>


  <div id="message">
    Đang tải dữ liệu...
  </div>


  <!-- BẢNG -->

  <div class="table-box">

    <table>

      <thead>

        <tr>

          <th>#</th>

          <th>Mã đơn</th>

          <th>Tên</th>

          <th>Phần thưởng</th>

          <th>Giá</th>

          <th>Thời gian</th>

          <th>Trạng thái</th>

          <th>Thao tác</th>

        </tr>

      </thead>


      <tbody id="orders">

      </tbody>

    </table>

  </div>


</div>


<script type="module">

  import {
    initializeApp
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


  import {
    getFirestore,
    collection,
    getDocs,
    updateDoc,
    deleteDoc,
    doc,
    query,
    orderBy
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* =========================
     FIREBASE
  ========================= */

  const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain:
      "YOUR_PROJECT.firebaseapp.com",

    projectId:
      "YOUR_PROJECT_ID",

    storageBucket:
      "YOUR_PROJECT.appspot.com",

    messagingSenderId:
      "YOUR_SENDER_ID",

    appId:
      "YOUR_APP_ID"

  };


  const app =
    initializeApp(firebaseConfig);

  const db =
    getFirestore(app);


  let allOrders = [];


  /* =========================
     ESCAPE
  ========================= */

  function escapeHTML(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =========================
     LOAD ORDERS
  ========================= */

  async function loadOrders() {

    const message =
      document.getElementById(
        "message"
      );


    try {

      message.innerText =
        "Đang tải đơn hàng...";


      const q = query(
        collection(
          db,
          "exchangeRequests"
        ),
        orderBy(
          "createdAt",
          "desc"
        )
      );


      const snapshot =
        await getDocs(q);


      allOrders = [];


      snapshot.forEach(item => {

        allOrders.push({

          id: item.id,

          ...item.data()

        });

      });


      updateStats();

      renderOrders();


      message.innerText =
        `Đã tải ${allOrders.length} đơn hàng.`;

    } catch (error) {

      console.error(error);

      message.innerText =
        "Không thể tải dữ liệu Firebase.";

    }

  }


  /* =========================
     THỐNG KÊ
  ========================= */

  function updateStats() {

    const total =
      allOrders.length;


    const pending =
      allOrders.filter(
        order =>
          order.status === "pending"
      ).length;


    const completed =
      allOrders.filter(
        order =>
          order.status === "completed"
      ).length;


    const cancelled =
      allOrders.filter(
        order =>
          order.status === "cancelled"
      ).length;


    document.getElementById(
      "totalOrders"
    ).textContent = total;


    document.getElementById(
      "pendingOrders"
    ).textContent = pending;


    document.getElementById(
      "completedOrders"
    ).textContent = completed;


    document.getElementById(
      "cancelledOrders"
    ).textContent = cancelled;

  }


  /* =========================
     HIỂN THỊ
  ========================= */

  function renderOrders() {

    const tbody =
      document.getElementById(
        "orders"
      );


    const search =
      document.getElementById(
        "search"
      )
      .value
      .trim()
      .toLowerCase();


    const filter =
      document.getElementById(
        "statusFilter"
      ).value;


    let filtered =
      allOrders.filter(order => {

        const code =
          String(
            order.orderCode ||
            order.id ||
            ""
          ).toLowerCase();


        const name =
          String(
            order.name || ""
          ).toLowerCase();


        const matchSearch =
          code.includes(search) ||
          name.includes(search);


        const matchStatus =
          filter === "all" ||
          order.status === filter;


        return (
          matchSearch &&
          matchStatus
        );

      });


    if (!filtered.length) {

      tbody.innerHTML = `

        <tr>

          <td
            colspan="8"
            class="empty">

            Không tìm thấy đơn hàng.

          </td>

        </tr>

      `;

      return;

    }


    tbody.innerHTML =
      filtered.map(
        (order, index) => {

          const code =
            order.orderCode ||
            order.id;


          let statusText =
            "Đang chờ";


          if (
            order.status ===
            "completed"
          ) {
            statusText =
              "Hoàn thành";
          }


          if (
            order.status ===
            "cancelled"
          ) {
            statusText =
              "Đã hủy";
          }


          const status =
            order.status ||
            "pending";


          return `

            <tr>

              <td>
                ${index + 1}
              </td>

              <td>

                <span
                  class="order-code">

                  ${escapeHTML(code)}

                </span>

              </td>

              <td>
                ${escapeHTML(
                  order.name
                )}
              </td>

              <td>
                ${escapeHTML(
                  order.reward
                )}
              </td>

              <td>
                ${escapeHTML(
                  order.price
                )}
              </td>

              <td>
                ${escapeHTML(
                  order.time
                )}
              </td>

              <td>

                <span
                  class="badge ${escapeHTML(status)}">

                  ${statusText}

                </span>

              </td>

              <td>

                <div class="actions">

                  <button
                    class="done"
                    onclick="completeOrder('${escapeHTML(order.id)}')">

                    Hoàn thành

                  </button>

                  <button
                    class="cancel"
                    onclick="cancelOrder('${escapeHTML(order.id)}')">

                    Hủy

                  </button>

                  <button
                    class="delete"
                    onclick="deleteOrder('${escapeHTML(order.id)}')">

                    Xóa

                  </button>

                </div>

              </td>

            </tr>

          `;

        }
      ).join("");

  }


  /* =========================
     HOÀN THÀNH
  ========================= */

  window.completeOrder =
    async function(id) {

      try {

        await updateDoc(

          doc(
            db,
            "exchangeRequests",
            id
          ),

          {
            status: "completed"
          }

        );


        await loadOrders();

      } catch (error) {

        console.error(error);

        alert(
          "Không thể cập nhật đơn."
        );

      }

    };


  /* =========================
     HỦY
  ========================= */

  window.cancelOrder =
    async function(id) {

      try {

        await updateDoc(

          doc(
            db,
            "exchangeRequests",
            id
          ),

          {
            status: "cancelled"
          }

        );


        await loadOrders();

      } catch (error) {

        console.error(error);

        alert(
          "Không thể cập nhật đơn."
        );

      }

    };


  /* =========================
     XÓA
  ========================= */

  window.deleteOrder =
    async function(id) {

      const ok =
        confirm(
          "Bạn có chắc muốn xóa đơn này?"
        );


      if (!ok) return;


      try {

        await deleteDoc(

          doc(
            db,
            "exchangeRequests",
            id
          )

        );


        await loadOrders();

      } catch (error) {

        console.error(error);

        alert(
          "Không thể xóa đơn."
        );

      }

    };


  /* =========================
     TÌM KIẾM
  ========================= */

  document
    .getElementById("search")
    .addEventListener(
      "input",
      renderOrders
    );


  document
    .getElementById("statusFilter")
    .addEventListener(
      "change",
      renderOrders
    );


  /* =========================
     KHỞI ĐỘNG
  ========================= */

  loadOrders();

</script>

</body>
</html>
