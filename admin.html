<body>

<header>

</header>


<!-- ========================= -->
<!-- ĐĂNG NHẬP -->

<div id="loginBox" class="login-box">

    <h2>🔐 Đăng nhập Admin</h2>

    <input
        type="text"
        id="username"
        placeholder="Tên đăng nhập"

        id="password"

    >

    <button onclick="login()">
        Đăng nhập
    </button>

    <p id="error"></p>

</div>


<!-- ========================= -->
<!-- ADMIN PANEL -->
<!-- ========================= -->

<div id="adminPanel">

<div class="container">

    <div class="status">

        <span id="firebaseStatus">
            🔄 Đang kết nối Firebase...
        </span>

        <br><br>

        <button
            class="refresh"
            onclick="loadOrders()"
        >
            🔄 Làm mới
        </button>

        <button
            class="logout"
            onclick="logout()"
        >

            <h2 id="approvedOrders">0</h2>

                <tr>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    updateDoc,
    deleteDoc,
    doc,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyD28nAKhfVQHF_I134R0YyaWQuGw2FMliY",

    authDomain:
        "admin-shopcuaquan.firebaseapp.com",

    projectId:
        "admin-shopcuaquan",

    storageBucket:
        "admin-shopcuaquan.firebasestorage.app",

    messagingSenderId:
        "608228191463",

    appId:
        "1:608228191463:web:52298a53e0f0a829874642",

    measurementId:
        "G-M67P3RDCH1"
};


/* =========================
   KHỞI TẠO
========================= */

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


document.getElementById(
    "firebaseStatus"
).innerHTML =
    "🟢 Firebase đã kết nối";


/* =========================
   TÀI KHOẢN ADMIN
========================= */

const ADMIN_USERNAME =
    "adminquan";

const ADMIN_PASSWORD =
    "AnhQuan_123";


/* =========================
   ĐĂNG NHẬP
========================= */

window.login = function() {

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;


    if (
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
    ) {

        sessionStorage.setItem(
            "adminLogged",
            "true"
        );

        document.getElementById(
            "loginBox"
        ).style.display = "none";

        document.getElementById(
            "adminPanel"
        ).style.display = "block";

        loadOrders();

    } else {

        document.getElementById(
            "error"
        ).innerText =
            "❌ Sai tên đăng nhập hoặc mật khẩu!";
    }
};


/* =========================
   ĐĂNG XUẤT
========================= */

window.logout = function() {

    sessionStorage.removeItem(
        "adminLogged"
    );

    location.reload();
};


/* =========================
   KIỂM TRA ĐĂNG NHẬP
========================= */

if (
    sessionStorage.getItem(
        "adminLogged"
    ) === "true"
) {

    document.getElementById(
        "loginBox"
    ).style.display = "none";

    document.getElementById(
        "adminPanel"
    ).style.display = "block";

    loadOrders();
}


/* =========================
   TẢI ĐƠN FIREBASE
========================= */

async function loadOrders() {

    const body =
        document.getElementById(
            "ordersBody"
        );


    body.innerHTML = `
        <tr>
            <td colspan="8" class="empty">
                🔄 Đang tải đơn...
            </td>
        </tr>
    `;


    try {

        const q = query(
            collection(
                db,
                "exchangeRequests"
            ),
            orderBy(
                "createdAt",
                "desc"
            )
        );


        const snapshot =
            await getDocs(q);


        const orders = [];


        snapshot.forEach(
            item => {

                orders.push({
                    id: item.id,
                    ...item.data()
                });

            }
        );


        renderOrders(orders);


    } catch (error) {

        console.error(error);


        body.innerHTML = `
            <tr>
                <td colspan="8" class="empty">
                    ❌ Không thể tải dữ liệu.<br><br>
                    ${escapeHTML(
                        error.message
                    )}
                </td>
            </tr>
        `;
    }
}


/* =========================
   HIỂN THỊ
========================= */

function renderOrders(orders) {

    const body =
        document.getElementById(
            "ordersBody"
        );


    const pending =
        orders.filter(
            x => x.status === "pending"
        ).length;


    const approved =
        orders.filter(
            x => x.status === "approved"
        ).length;


    const rejected =
        orders.filter(
            x => x.status === "rejected"
        ).length;


    document.getElementById(
        "totalOrders"
    ).innerText =
        orders.length;


    document.getElementById(
        "pendingOrders"
    ).innerText =
        pending;


    document.getElementById(
        "approvedOrders"
    ).innerText =
        approved;


    document.getElementById(
        "rejectedOrders"
    ).innerText =
        rejected;


    if (orders.length === 0) {

        body.innerHTML = `
            <tr>
                <td
                    colspan="8"
                    class="empty"
                >
                    📭 Chưa có yêu cầu đổi quà.
                </td>
            </tr>
        `;

        return;
    }


    body.innerHTML = "";


    orders.forEach(
        (item, index) => {

            let statusText =
                "⏳ Chờ duyệt";

            let statusClass =
                "pending";


            if (
                item.status ===
                "approved"
            ) {

                statusText =
                    "✅ Đã duyệt";

                statusClass =
                    "approved";
            }


            if (
                item.status ===
                "rejected"
            ) {

                statusText =
                    "❌ Từ chối";

                statusClass =
                    "rejected";
            }


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${escapeHTML(
                        item.name || ""
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        item.reward || ""
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        item.price || ""
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        item.currency || ""
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        item.time || ""
                    )}
                </td>

                <td class="${statusClass}">
                    ${statusText}
                </td>

                <td>

                    <button
                        class="approve"
                        onclick="changeStatus(
                            '${item.id}',
                            'approved'
                        )"
                    >
                        ✓ Duyệt
                    </button>

                    <button
                        class="reject"
                        onclick="changeStatus(
                            '${item.id}',
                            'rejected'
                        )"
                    >
                        ✕ Từ chối
                    </button>

                    <button
                        class="delete"
                        onclick="removeOrder(
                            '${item.id}'
                        )"
                    >
                        🗑️ Xóa
                    </button>

                </td>
            `;


            body.appendChild(row);

        }
    );
}


/* =========================
   ĐỔI TRẠNG THÁI
========================= */

window.changeStatus =
async function(id, status) {

    try {

        await updateDoc(
            doc(
                db,
                "exchangeRequests",
                id
            ),
            {
                status: status
            }
        );


        await loadOrders();


    } catch (error) {

        alert(
            "❌ Lỗi: " +
            error.message
        );
    }
};


/* =========================
   XÓA ĐƠN
========================= */

window.removeOrder =
async function(id) {

    const ok =
        confirm(
            "Bạn có chắc muốn xóa đơn này?"
        );


    if (!ok) {
        return;
    }


    try {

        await deleteDoc(
            doc(
                db,
                "exchangeRequests",
                id
            )
        );


        await loadOrders();


    } catch (error) {

        alert(
            "❌ Lỗi: " +
            error.message
        );
    }
};


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}

</script>

</body>
</html>
